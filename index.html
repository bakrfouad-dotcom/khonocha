<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos 10 Jours d'Aventure ♥</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1c7bd;
            font-family: 'Caveat', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .scrapbook-page {
            background-color: #f7f3ed;
            width: 100%;
            max-width: 850px;
            min-height: 1150px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            position: relative;
            border-radius: 4px;
            background-image: radial-gradient(#e2dad0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .title-container {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 3em;
            color: #2c2c2c;
            font-weight: 600;
        }

        /* Cadre central avec Effet Suspens */
        .central-frame {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 430px;
            background: #2c2c2c;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            border: 10px solid #c8a97e;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .central-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Caché au début pour le suspens */
        }

        .suspense-box {
            color: white;
            padding: 20px;
        }

        .suspense-btn {
            margin-top: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            padding: 12px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Photos Polaroid */
        .photo-polaroid {
            background-color: #ffffff;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            position: absolute;
            border-radius: 2px;
        }

        .photo-polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #p1 { top: 150px; left: 30px; width: 190px; height: 220px; transform: rotate(-5deg); z-index: 4; }
        #p2 { top: 160px; right: 30px; width: 190px; height: 220px; transform: rotate(6deg); z-index: 4; }
        #p3 { top: 420px; left: 20px; width: 200px; height: 220px; transform: rotate(3deg); z-index: 6; }
        #p4 { top: 420px; right: 20px; width: 180px; height: 210px; transform: rotate(-4deg); z-index: 6; }
        #p5 { bottom: 260px; left: 40px; width: 210px; height: 220px; transform: rotate(2deg); z-index: 3; }
        #p6 { bottom: 260px; right: 40px; width: 210px; height: 220px; transform: rotate(-3deg); z-index: 3; }

        /* Section Question / RESSENTI & CHOIX */
        .feedback-section {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #ffffff;
            border: 3px dashed #c8a97e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .feedback-title {
            font-size: 2em;
            color: #2c2c2c;
            margin-bottom: 5px;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            padding: 10px 15px;
            border: none;
            background-color: #2c2c2c;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #c8a97e;
            transform: scale(1.05);
        }

        #result-box {
            margin-top: 15px;
            font-size: 1.6em;
            color: #d9534f;
            font-weight: bold;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="scrapbook-page">
        <!-- Titre -->
        <div class="title-container">
            <h1 class="title">10 Jours d'Aventure... Et Une Surprise ! ♥</h1>
        </div>

        <!-- Photo Centrale Cachée pour le SUSPENS -->
        <div class="central-frame" id="main-frame">
            <div class="suspense-box" id="suspense-text">
                <p style="font-size: 1.8em;">🔒 Moment Top Secret</p>
                <p style="font-family: 'Montserrat'; font-size: 0.8em; margin-top: 5px;">Es-tu prête à revoir LE moment ?</p>
                <button class="suspense-btn" onclick="revealSecret()">RÉVÉLER LA SURPRISE ! 💍</button>
            </div>
            <img src="scrapbook.png" id="secret-img" alt="La Grande Demande">
        </div>

        <!-- Galerie Photos (Uniquement des fichiers .jpg et .png) -->
        <div class="photo-polaroid" id="p1"><img src="Bague.jpg" alt="Bague"></div>
        <div class="photo-polaroid" id="p2"><img src="demandee.png" alt="La Demande"></div>
        <div class="photo-polaroid" id="p3"><img src="IMG_4918.jpg" alt="Souvenir 1"></div>
        <div class="photo-polaroid" id="p4"><img src="IMG_6720.jpg" alt="Souvenir 2"></div>
        <div class="photo-polaroid" id="p5"><img src="IMG_6789.jpg" alt="Souvenir 3"></div>
        <div class="photo-polaroid" id="p6"><img src="IMG_6807.jpg" alt="Souvenir 4"></div>

        <!-- Section Choix & Ressenti Humour -->
        <div class="feedback-section">
            <h2 class="feedback-title">Bilan officiel de ces 10 jours : Ton ressenti ? 🎤</h2>
            
            <div class="options">
                <button class="btn" onclick="chooseOption('1')">😍 10/10 ! Meilleure demande du monde !</button>
                <button class="btn" onclick="chooseOption('2')">💍 Prête à supporter ma tête toute ta vie ?</button>
                <button class="btn" onclick="chooseOption('3')">😭 J'ai pleuré mais j'ai dit OUI !</button>
                <button class="btn" onclick="chooseOption('4')">❌ Non, je veux réfléchir... (Piège !)</button>
            </div>

            <div id="result-box"></div>
        </div>

    </div>

    <script>
        // Fonction pour révéler la photo centrale
        function revealSecret() {
            document.getElementById('suspense-text').style.display = 'none';
            document.getElementById('secret-img').style.display = 'block';
            document.getElementById('main-frame').style.background = 'white';
        }

        // Fonction pour afficher les réponses rigolotes
        function chooseOption(choice) {
            const result = document.getElementById('result-box');
            if(choice === '1') {
                result.innerHTML = "On valide ! Tu as officiellement épousé un génie. 😎🏆";
            } else if(choice === '2') {
                result.innerHTML = "Pas de retour en arrière possible, le contrat est signé ! ✍️❤️";
            } else if(choice === '3') {
                result.innerHTML = "Sortez les mouchoirs, mais l'important c'est le OUI ! 🎉🥂";
            } else if(choice === '4') {
                result.innerHTML = "⚠️ ERREUR 404 : Option refusée ! Le bouton 'OUI' a été cliqué automatiquement. 😂";
            }
        }
    </script>

</body>
</html>
