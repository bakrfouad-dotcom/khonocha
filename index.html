<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos 10 Jours d'Aventure ♥</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d1c7bd;
            font-family: 'Caveat', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .scrapbook-page {
            background-color: #f7f3ed;
            width: 100%;
            max-width: 850px;
            min-height: 1150px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            position: relative;
            border-radius: 4px;
            background-image: radial-gradient(#e2dad0 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .title-container {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .title {
            font-size: 3em;
            color: #2c2c2c;
            font-weight: 600;
        }

        /* Cadre central */
        .central-frame {
            position: absolute;
            top: 210px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 440px;
            background: #fff;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 5;
            border: 10px solid #c8a97e;
        }

        .central-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Photos Polaroid */
        .photo-polaroid {
            background-color: #ffffff;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            position: absolute;
            border-radius: 2px;
        }

        .photo-polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #p1 { top: 160px; left: 30px; width: 190px; height: 220px; transform: rotate(-5deg); z-index: 4; }
        #p2 { top: 170px; right: 30px; width: 190px; height: 220px; transform: rotate(6deg); z-index: 4; }
        #p3 { top: 430px; left: 20px; width: 200px; height: 220px; transform: rotate(3deg); z-index: 6; }
        #p4 { top: 430px; right: 20px; width: 180px; height: 210px; transform: rotate(-4deg); z-index: 6; }
        #p5 { bottom: 220px; left: 40px; width: 220px; height: 220px; transform: rotate(2deg); z-index: 3; }
        #p6 { bottom: 220px; right: 40px; width: 220px; height: 220px; transform: rotate(-3deg); z-index: 3; }

        /* Section Question / RESSENTI */
        .feedback-section {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #ffffff;
            border: 2px dashed #b89768;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .feedback-title {
            font-size: 2.2em;
            color: #2c2c2c;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            padding: 10px 15px;
            border: none;
            background-color: #c8a97e;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #a88558;
            transform: scale(1.05);
        }

        #result-text {
            font-size: 1.8em;
            color: #8b2626;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scrapbook-page">
        <!-- Titre Sans Date -->
        <div class="title-container">
            <h1 class="title">Souvenirs de nos 10 Jours d'Aventure ♥</h1>
        </div>

        <!-- Photo Centrale (La Demande / Fiançailles) -->
        <div class="central-frame">
            <img src="scrapbook.png" alt="Photo Fiançailles">
        </div>

        <!-- Galerie Photos -->
        <div class="photo-polaroid" id="p1"><img src="Bague.jpg" alt="Bague"></div>
        <div class="photo-polaroid" id="p2"><img src="demandee.png" alt="La Demande"></div>
        <div class="photo-polaroid" id="p3"><img src="photo1.jpg" alt="Souvenir"></div>
        <div class="photo-polaroid" id="p4"><img src="photo2.jpg" alt="Souvenir"></div>
        <div class="photo-polaroid" id="p5"><img src="photo3.jpg" alt="Souvenir"></div>
        <div class="photo-polaroid" id="p6"><img src="photo4.jpg" alt="Souvenir"></div>

        <!-- Section interactive pour son ressenti -->
        <div class="feedback-section">
            <h2 class="feedback-title">Bilan officiel de ces 10 jours + la demande : Ton ressenti ? 💍</h2>
            
            <div class="options">
                <button class="btn" onclick="showResponse('100/10 ! Meilleur fiancé au monde 🏆')">100/10, j'ai surkiffé !</button>
                <button class="btn" onclick="showResponse('Prête pour 80 ans de plus avec toi ! 👰❤️')">Je signe direct pour la vie !</button>
                <button class="btn" onclick="showResponse('J\'ai failli m\'évanouir mais J\'AI DIT OUI ! 🎉')">Encore sous le choc !</button>
            </div>

            <div id="result-text"></div>
        </div>

    </div>

    <script>
        function showResponse(text) {
            document.getElementById('result-text').innerText = text;
        }
    </script>

</body>
</html>
